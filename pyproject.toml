[project]
name = "finances"
version = "0.1.0"
description = "Private, read-only personal finance dashboard. All data stays on your device."
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
finances = "finances.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
finances = ["web/*"]
